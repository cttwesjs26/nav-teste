<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site de Teste</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1b2a4a, #0b1020 60%);
    color: #e8eefc;
  }
  main { text-align: center; padding: 2rem; }
  h1 {
    font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .5rem;
    background: linear-gradient(90deg, #4ade80, #38bdf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { opacity: .8; margin: .25rem 0; }
  code { background: #ffffff14; padding: .15rem .4rem; border-radius: .35rem; }
</style>
</head>
<body>
<main>
  <h1>Olá, mundo!</h1>
  <p>Site de teste criado no Termux + Chromium.</p>
  <p>Hospedado no Netlify · <code id="when"></code></p>
</main>
<script>
  document.getElementById('when').textContent = new Date().toLocaleString('pt-BR');
</script>
</body>
</html>
